# 배포 서버 설정. 값은 모두 deploy/.env 환경변수에서 읽는다 (이 파일에 비밀값을 쓰지 않는다).
# deploy/docker-compose.yml 이 SPRING_PROFILES_ACTIVE=prod 와 DB 주소(db 컨테이너)를 넣어 실행한다
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/dotorich?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    defer-datasource-initialization: true   # 테이블 생성 후 data.sql 실행
  sql:
    init:
      mode: always                          # data.sql (섹터·단계·캐릭터·기본 용어) 넣기. INSERT IGNORE 라 재실행해도 안전
      encoding: UTF-8

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}  # 예: http://13.125.0.0,http://localhost:5173

jwt:
  secret: ${JWT_SECRET}

kakao:
  client-id: ${KAKAO_CLIENT_ID}
  client-secret: ${KAKAO_CLIENT_SECRET:}
  admin-key: ${KAKAO_ADMIN_KEY}

gemini:
  api-key: ${GEMINI_API_KEY:}               # 비우면 가짜 AI 튜터
