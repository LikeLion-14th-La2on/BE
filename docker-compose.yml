# 로컬 MySQL: docker compose up -d
services:
  mysql:
    image: mysql:8.4
    container_name: dotorich-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root1234
      MYSQL_DATABASE: dotorich
      MYSQL_USER: dotorich
      MYSQL_PASSWORD: dotorich1234
      TZ: Asia/Seoul
    ports:
      - "3306:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data:
