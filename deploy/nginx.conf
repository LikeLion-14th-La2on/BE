# /etc/nginx/sites-available/dotorich 에 복사하고 sites-enabled 에 링크한다.
# 프론트(빌드 결과)와 백엔드를 같은 주소로 내보내서 CORS·HTTPS 혼합 문제를 없앤다.
server {
    listen 80;
    server_name _;

    # 프론트: FE 레포 npm run build 결과(dist)를 여기에 올린다
    root /home/ubuntu/fe/dist;
    index index.html;

    # 백엔드 API, Swagger
    location ~ ^/(api|swagger-ui|v3/api-docs|actuator)(/|$) {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;   # AI 튜터(Gemini) 응답 대기
    }

    location = /swagger-ui.html {
        proxy_pass http://127.0.0.1:8080;
    }

    # 프론트 라우터(/login, /oauth/kakao 등)는 index.html 로
    location / {
        try_files $uri $uri/ /index.html;
    }
}
