# main 에 push 하면 jar 를 빌드해서 EC2 에 올리고 다시 실행한다 (NEOLIZ 방식).
# 필요한 GitHub Secrets: EC2_HOST, EC2_USERNAME(ubuntu), EC2_SSH_KEY(pem 내용 전체)
# 서버의 비밀값은 GitHub 이 아니라 EC2 의 /home/ubuntu/app/.env 에 둔다 (docs/배포_가이드.md)
name: Deploy Backend

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew bootJar
          cp build/libs/*-SNAPSHOT.jar app.jar

      - name: Copy jar to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "app.jar"
          target: "/home/ubuntu/app"

      - name: Restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/app
            sudo fuser -k 8080/tcp || true
            set -a; . ./.env; set +a
            nohup java -Xmx512m -jar app.jar --spring.profiles.active=prod > app.log 2>&1 &
            for i in $(seq 1 30); do
              curl -sf http://localhost:8080/api/v1/health >/dev/null && echo "started" && exit 0
              sleep 3
            done
            echo "서버가 90초 안에 뜨지 않음. app.log 확인" && tail -50 app.log && exit 1
